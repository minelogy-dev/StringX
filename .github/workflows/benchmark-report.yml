name: Benchmark results report

on:
  pull_request:
    paths:
      - '.github/workflows/benchmark-report.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed benchmark run to report
        required: true
        default: '41327686998'
        type: string
      artifact_name:
        description: Optional artifact name (defaults to search-performance-RUN_ID)
        required: false
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  report:
    name: StringX, SDS and bstrlib comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download existing benchmark results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name || format('search-performance-{0}', inputs.run_id || '41327686998') }}
          path: build/benchmark-report
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id || '41327686998' }}
      - name: Report all libraries from the saved run
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          roots = list(Path("build/benchmark-report").rglob("environment.json"))
          assert len(roots) == 1, roots
          root = roots[0].parent
          environment = json.loads(roots[0].read_text())
          print("SAVED_BENCH_ENV_JSON=" + json.dumps(environment), flush=True)
          report = ["# Saved benchmark: library comparison", "",
                    "Values are median microseconds per operation from the saved run.",
                    "Search rows use SDS with glibc memmem/memchr.", ""]
          for compiler in ("gcc-14", "clang-19"):
              path = root / compiler / "after" / "summary.json"
              if not path.exists():
                  path = root / compiler / "summary.json"
              data = json.loads(path.read_text())
              rows = data["results"] if isinstance(data, dict) else data
              print("LIBRARY_RESULTS_JSON=" + json.dumps(
                  {"compiler": compiler, "results": rows}), flush=True)
              groups = {}
              for row in rows:
                  groups.setdefault(row["case"], {})[row["library"]] = row
              report += [f"## {compiler}", "",
                         "| Case | StringX us | SDS us | bstrlib us |",
                         "| --- | ---: | ---: | ---: |"]
              for case, libraries in sorted(groups.items()):
                  values = []
                  for aliases in (("StringX", "StringX+materialize"),
                                  ("SDS+glibc", "SDS", "SDS+raw-view"),
                                  ("bstrlib", "bstrlib+borrowed-view")):
                      row = next((libraries[name] for name in aliases if name in libraries), None)
                      values.append(f'{row["median_ns"] / 1000:.3f}' if row else "-")
                  report.append(f"| {case} | " + " | ".join(values) + " |")
              report.append("")
          text = "\n".join(report) + "\n"
          print(text, flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as dest:
              dest.write(text)
          PY
